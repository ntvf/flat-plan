# Renovated state, expressed as changes to the surveyed as-is model.
extends: as_is.yaml

meta:
  title: Mieszkanie - stan projektowany
  title_en: Flat - target state
  state: target
  sheet_name: RZUT - STAN PROJEKTOWANY
  sheet_description: Projekt mieszkania - rzut kondygnacji

changes:
  update:
    rooms:
      - id: 123
        subtract: [8, 9]
    equipment:
      - id: AC_living
        at: [7.09, 7.455, 2.33]
        host: W_bath2_n
        room: 123
        faces: open_living
        renovation_status: relocated
        support:
          backing: 18 mm plywood or OSB between reinforced studs
          bracket_load: verify against selected unit
        connections:
          refrigerant_and_control: reuse existing OB3 line plus bathroom-ceiling extension
          condensate: separate gravity route to SH_san; final fall to be designed
        note: "relocated on the as-is pipe projection x=7.49 to the open-living face of the new 0.125 m plasterboard wall"
    service_routes:
      - id: AC_living_lines
        renovation_status: retained_and_reused
        note: "existing concealed line set retained from OB3 to the former AC connection"
    doors:
      - { id: D4, has_leaf: true }
      - { id: D5, has_leaf: true }
      - { id: D6, has_leaf: true }
      - { id: D7, has_leaf: true }
      - { id: D8, has_leaf: true }

  add:
    rooms:
      - id: 9
        name: Łazienka 2
        name_uk: Ванна кімната 2
        name_ru: Ванная 2
        function: bathroom
        renovation_status: new
        clear: [3.38, 1.35]
        label_at: [7.10, 6.72]
        polygon:
          - [5.26, 5.98]
          - [8.64, 5.98]
          - [8.64, 6.37]
          - [8.96, 6.37]
          - [8.96, 7.33]
          - [8.64, 7.33]
          - [5.26, 7.33]
        footprint:
          - [5.26, 5.88]
          - [6.34, 5.88]
          - [6.34, 5.98]
          - [8.64, 5.98]
          - [8.64, 6.37]
          - [8.96, 6.37]
          - [8.96, 7.33]
          - [8.64, 7.33]
          - [8.64, 7.455]
          - [5.26, 7.455]

    walls:
      - id: W_bath2_n
        at: [5.26, 7.33]
        size: [3.38, 0.125]
        material: plasterboard
        renovation_status: new
        note: 0.125 m north bathroom wall from storage to ventilation riser
      - id: W_bath2_door
        at: [5.26, 5.88]
        size: [0.99, 0.10]
        material: plasterboard
        renovation_status: new
        note: bathroom closure from storage to the room 7 wall face
      - id: W_entry_screen
        at: [2.00, 9.28]
        size: [1.20, 0.10]
        material: plasterboard
        renovation_status: new
        note: kitchen screen wall along the entrance; fridge and prep 2 stand on its north face
      - id: W_entry_closet_back
        at: [1.40, 9.88]
        size: [0.60, 0.10]
        material: plasterboard
        renovation_status: new
        note: back of the 60x60 coat closet that opens south onto the hall

    service_routes:
      - id: AC_living_extension_bath_ceiling
        name: Przedłużenie przewodów nad sufitem łazienki 2
        ifc_class: IfcPipeSegment
        system: refrigerant_and_control
        nominal_diameter: 0.04
        installation: mixed
        source: AC_living_lines
        destination: AC_living
        renovation_status: new
        points:
          - [7.49, 5.93, 2.48]
          - [7.49, 5.93, 2.63]
          - [7.49, 7.3925, 2.63]
          - [7.49, 7.3925, 2.48]
        segments:
          - { from: 0, to: 1, installation: concealed_in_wall, host: W_258 }
          - { from: 1, to: 2, installation: above_bathroom_ceiling, room: 9 }
          - { from: 2, to: 3, installation: concealed_in_wall, host: W_bath2_n }
        note: "straight extension on the as-is x=7.49 projection; brazed joint accessible above bathroom ceiling; condensate routed separately to SH_san"

    doors:
      - id: D9
        at: [5.36, 5.88]
        size: [0.80, 0.10]
        has_leaf: true
        swing: [start, "-"]
        renovation_status: new
        note: 0.80 m bathroom door opening outward into the corridor

  # The 100 l tank leaves the open space so the kitchen can take the west
  # wall; its new location is still a tender item (make_tender_docs.py).
  remove:
    equipment: [HW_TANK_100L]
    # Kitchen brick tiles give way to the green backsplash (finishes.splash);
    # the walls above it are painted. BRICK_EAST behind the TV is removed too.
    wall_finishes: [BRICK_NORTH_OB1, BRICK_NW_CHAMFER, BRICK_WEST_TO_TANK, BRICK_EAST]

# Floor and wall finishes. Quantities and tile setting-out are computed from
# this data and the room geometry by scripts/finishes.py. Tile `size` is
# [along, up] for walls and [x, y] in plan for floors; planks with
# `direction: N` run north-south. All tiles beige "scratched" unless noted.
finishes:
  door_head: 2.05
  materials:
    tile_floor: { kind: tile, size: [0.60, 0.60], waste: 0.10, colour: "#d9c9ac",
                  name_uk: "Керамограніт 60×60, бежевий з ефектом подряпин" }
    tile_wall: { kind: tile, size: [0.60, 0.30], waste: 0.10, colour: "#e4d7bf",
                 name_uk: "Плитка настінна 30×60 горизонтально, бежева з ефектом подряпин" }
    tile_leaves: { kind: tile, size: [1.20, 0.60], waste: 0.15, colour: "#6f9a5a",
                   name_uk: "Декор 120×60 «великі зелені листки», горизонтально, різати по ширині стіни" }
    tile_circles: { kind: tile, size: [1.20, 0.60], waste: 0.15, colour: "#cfb48c",
                    name_uk: "Декор 120×60 бежевий з колами, горизонтально" }
    splash_green: { kind: tile, size: [0.08, 0.25], waste: 0.10, colour: "#4e7f5c",
                    name_uk: "Плитка 8×25 зелена, вертикально, шов у шов" }
    wood_oak: { kind: plank, size: [0.20, 1.20], waste: 0.07, colour: "#b88a58",
                name_uk: "Інженерна дошка (фанера + шар дуба) ~120×20, теплий дуб" }
  floors:
    - { id: FL_OPEN, room: 123, material: tile_floor, within: [1.40, 8.05, 4.13, 12.89],
        name_uk: "Вхід і кухня" }
    - { id: FL_LIVING, room: 123, material: wood_oak, exclude: [1.40, 8.05, 4.13, 12.89], direction: N,
        name_uk: "Коридор, обідня зона, вітальня, робоче місце" }
    - { id: FL_BATH1, room: 4, material: tile_floor, exclude_items: [B11], name_uk: "Ванна кімната 1" }
    - { id: FL_BATH2, room: 9, material: tile_floor, name_uk: "Ванна кімната 2" }
    - { id: FL_BED1, room: 5, material: wood_oak, direction: N, name_uk: "Спальня 1" }
    - { id: FL_BED2, room: 6, material: wood_oak, direction: N, name_uk: "Спальня 2" }
    - { id: FL_BED3, room: 7, material: wood_oak, direction: N, name_uk: "Спальня 3" }
    - { id: FL_STORE, room: 8, material: wood_oak, direction: N, name_uk: "Комора" }
  # Bathroom walls tiled floor to ceiling: full rows from the ceiling down,
  # cut row at the floor, no cut under 50 % (bathroom 2 ceiling 2.40 = 8 full rows).
  walls:
    - { id: WT_BATH1, room: 4, material: tile_wall, height: 2.70, name_uk: "Ванна кімната 1",
        features: [{ segment: [[0.40, 4.96], [2.32, 4.96]], material: tile_circles }] }
    - { id: WT_BATH2, room: 9, material: tile_wall, height: 2.40, name_uk: "Ванна кімната 2",
        features: [{ segment: [[8.96, 6.37], [8.96, 7.33]], material: tile_leaves }] }
  # Kitchen backsplash between worktop (0.90) and wall cabinets (1.50).
  splash:
    material: splash_green
    base: 0.90
    top: 1.50
    segments:
      - { id: SP1, from: [1.40, 9.98], to: [2.00, 9.98], name_uk: "торець шафи-купе над K03" }
      - { id: SP2, from: [1.40, 9.98], to: [1.40, 12.17], name_uk: "західна стіна K03–K05" }
      - { id: SP3, from: [1.40, 12.17], to: [2.47, 12.89], name_uk: "скіс K06" }
      - { id: SP4, from: [2.47, 12.89], to: [2.84, 12.89], name_uk: "північна стіна до вікна OB1" }
      - { id: SP5, from: [3.74, 12.89], to: [4.13, 12.89], name_uk: "північна стіна над ПММ K08" }

