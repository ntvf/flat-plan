    status: existing_finished
    scope: flat
    layers_top_down:
      - { material: semi_dry_screed, thickness: 0.05 }
      - { material: extruded_polyethylene_reported, thickness: 0.05,
          note: "verify exact insulation product/material on site" }
    total_thickness: 0.10
    note: "finished screed; concealed drainage alterations require coordinated local opening and reinstatement"

# Door openings. `at` is the lower-left corner of the opening.
# `swing` is [hinge, side]: which end of the opening the leaf is hinged on,
# and which face of the wall it swings out from (+ = increasing X or Y).
# Interior leaves and swing directions are practical assumptions requested for
# everyday use, not surveyed - confirm on site before ordering doors.
doors:
  - { id: entry, at: [1.00, 8.28], size: [0.40, 0.90], nominal_width: 0.90, height: 2.10, frame_material: wood, swing: [start, "+"], note: "90 cm entrance leaf; south edge touches the outer-wall step line" }
  - { id: D4, at: [2.32, 6.005], size: [0.10, 0.90], nominal_width: 0.80, height: 2.10, frame_material: wood, has_leaf: true, swing: [start, "+"], note: "standard 80 cm bathroom leaf opens outward for safety and clears the approved fixtures" }
  - { id: D8, at: [3.32, 6.515], size: [0.10, 0.90], nominal_width: 0.80, height: 2.10, frame_material: wood, has_leaf: true, swing: [end, "+"], note: "standard 80 cm leaf opens into storage against its north side, avoiding the bathroom-door corridor swing" }
  - { id: D5, at: [2.47, 4.86], size: [0.90, 0.10], nominal_width: 0.90, height: 2.10, frame_material: wood, has_leaf: true, swing: [end, "-"], note: "standard 90 cm leaf opens into bedroom 5 toward the east partition" }
  - { id: D6, at: [3.47, 4.86], size: [0.90, 0.10], nominal_width: 0.80, height: 2.10, frame_material: wood, has_leaf: true, swing: [start, "-"], note: "standard 80 cm leaf opens into bedroom 6 toward the west partition" }
  - { id: D7, at: [6.25, 4.98], size: [0.10, 0.90], nominal_width: 0.90, height: 2.10, frame_material: wood, has_leaf: true, swing: [end, "+"], note: "standard 90 cm leaf opens into bedroom 7 against its north wall" }

