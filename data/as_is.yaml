  - { id: B4_BASIN_FAUCET, name: Bateria umywalkowa,
      ifc_class: IfcDiscreteAccessory, category: faucet,
      at: [0.40, 6.395, 0.92], size: [0.18, 0.12, 0.22],
      room: 4, mounting: fixture, back: west, renovation_status: existing }
  - { id: B4_WC, name: Miska WC podwieszana 40 x 70,
      ifc_class: IfcSanitaryTerminal, category: wc,
      at: [0.70, 7.25, 0.18], size: [0.40, 0.70, 0.24],
