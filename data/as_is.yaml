# AS-IS state of the flat, transcribed from the surveyed plan
# (survey-plan.jfif, "Загальна площа: 95.00 м²").
#
# Coordinate system: metres, origin at the OUTER south-west corner of the
# lower block (the south wall of rooms 5/6). X grows east, Y grows north.
#
# All room dimensions below are CLEAR (internal) dimensions as annotated on
# the survey. Wall thicknesses on the survey are schematic, so the written
# dimension chain is treated as authoritative, not the drawn wall widths.

meta:
  title: Mieszkanie - stan istniejący
  title_en: Flat - as-is state
  state: as_is
  sheet_name: RZUT - STAN ISTNIEJĄCY
  sheet_description: Inwentaryzacja mieszkania - rzut kondygnacji
  source_survey: survey-plan.jfif
  stated_total_area: 95.00
  ceiling_height: 2.70

thickness:
  exterior: 0.40
  partition: 0.10

# Outer face of the exterior wall, counter-clockwise from the SW corner.
# The north-west corner is a curve on the survey, approximated by a chamfer.
# It is NOT at 45 degrees: the survey puts its slope at dx/dy ~ 1.5, which is
# what the written 3.89 west side and 1.29 chamfer imply once the lower block
# meets the upper one in a square step.
outline:
  - [0.00, 0.00]      # SW corner, south wall of rooms 5/6
  - [6.09, 0.00]      # south wall runs east to the room 6/7 step
  - [6.09, 0.94]      # step north: room 7 is set back 0.94
  - [9.43, 0.94]      # south wall of room 7
  - [9.43, 13.29]     # east wall, thicker than the rest (see outline_thickness)
  - [2.35, 13.29]     # north (balcony) wall
  - [1.00, 12.38]     # corner cut at the north-west (1.29 internal)
  - [1.00, 8.28]      # west wall of the upper block (3.89 internal)
  - [0.00, 8.28]      # square step west to the lower block, on room 4's north
                      # face; the survey shows no chamfer here

# Exterior wall thickness per outline edge, keyed by the index of the edge's
# start vertex; edges not listed use thickness.exterior. Edge 3 is the east
# wall: the survey puts its inner face at 8.96 for the full height of the
# flat, which is 0.47 behind the 9.43 outer face, not the usual 0.40.
outline_thickness:
  3: 0.47

rooms:
  - id: 5
    name: Sypialnia 1
    name_uk: Спальня 1
    function: bedroom
    clear: [2.97, 4.46]
    polygon: [[0.40, 0.40], [3.37, 0.40], [3.37, 4.86], [0.40, 4.86]]

  - id: 6
    name: Sypialnia 2
    name_uk: Спальня 2
    function: bedroom
    clear: [2.78, 4.46]          # 2.52 wide over the southern 0.94
    polygon: [[3.47, 0.40], [5.99, 0.40], [5.99, 1.34], [6.25, 1.34], [6.25, 4.86], [3.47, 4.86]]

  - id: 7
    name: Sypialnia 3
    name_uk: Спальня 3
    function: bedroom
    clear: [2.61, 4.54]
    polygon: [[6.35, 1.34], [8.96, 1.34], [8.96, 5.88], [6.35, 5.88]]

  - id: 4
    name: Łazienka
    name_uk: Ванна кімната
    function: bathroom
    # Depth fitted to the survey: the north wall's south face reads 7.95,
    # which scores better on the overlay than the 2.92 first assumed.
    clear: [1.92, 2.99]
    polygon: [[0.40, 4.96], [2.32, 4.96], [2.32, 7.95], [0.40, 7.95]]
    # Pushed south of the centroid, which the D4 swing arc sweeps across.
    label_at: [1.36, 5.60]

  - id: 8
    name: Schowek
    name_uk: Комора
    function: storage
    clear: [1.74, 1.97]
    # 0.10 plaster-panel walls; corridor is 0.90 west and 1.02 south.
    polygon: [[3.42, 5.98], [5.16, 5.98], [5.16, 7.95], [3.42, 7.95]]
    # Outer face of the storage's own walls. This, not the clear polygon, is
    # what the storage removes from the surrounding open space.
    footprint: [[3.32, 5.88], [5.26, 5.88], [5.26, 8.05], [3.32, 8.05]]

  # Rooms 1 + 2 + 3 are a single continuous open space: entrance hall,
  # kitchen zone and living zone. The storage (8) is an island with a corridor
  # running right around it, so the storage area is subtracted.
  # Perimeter per survey: 3.89 west, 1.29 chamfer, 6.61 north, 6.62 east
  # (broken by the two service risers), then the 2.58 x 0.10 wall, which sits
  # directly on the north face of room 7 (verified against the survey photo).
  - id: 123
    name: Hall / Kuchnia / Salon (otwarta przestrzeń)
    name_uk: Хол / Кухня / Вітальня
    function: open_living
    label_edges: true
    subtract: [8]
    polygon:
      - [1.40, 8.05]     # north face of the bathroom's 0.10 north wall
      - [1.40, 12.17]    # 3.89 west wall
      - [2.47, 12.89]    # 1.29 corner cut at the NW
      - [8.96, 12.89]    # 6.61 north / balcony wall
      - [8.96, 8.12]     # east wall
      - [8.64, 8.12]     # ventilation riser projects 0.32
      - [8.64, 7.33]     #   0.79 long
      - [8.96, 7.33]
      - [8.96, 6.37]     # 0.96 of plain wall between the risers
      - [8.64, 6.37]     # canalisation riser projects 0.32
      - [8.64, 5.98]     #   0.39 long
      - [6.34, 5.98]     # 2.58 wall, 0.10 deep, sits directly on room 7
      - [6.34, 4.96]     # 1.28 corridor turns south, east of the storage
      - [2.42, 4.96]     # corridor south arm, along the bedroom wall
      - [2.42, 8.05]     # corridor west arm, outer face of the bathroom wall

# Partitions drawn explicitly, all 0.10 thick.
walls:
  - { id: W_bath_e, at: [2.32, 4.96], size: [0.10, 2.99], note: "bathroom east wall, holds D4" }
  - { id: W_store_w, at: [3.32, 5.88], size: [0.10, 2.17] }
  - { id: W_store_e, at: [5.16, 5.88], size: [0.10, 2.17] }
  - { id: W_store_n, at: [3.32, 7.95], size: [1.94, 0.10] }
  - { id: W_store_s, at: [3.32, 5.88], size: [1.94, 0.10] }
  - { id: W_258, at: [6.25, 5.88], size: [2.71, 0.10], note: "overlaps the room 7 perpendicular wall to form a closed corner; 2.30 of its north face is exposed" }
  # The bathroom's north wall. West of x=1.40 the bathroom is closed by the
  # 0.40 exterior step; east of it only this 0.10 partition separates the
  # bathroom from the corridor (survey shows the thick poche stopping at the
  # upper block's west wall and a thin line continuing to the east wall).
  - { id: W_bath_n, at: [1.40, 7.95], size: [1.02, 0.10], note: "bathroom north wall" }
  # Bedroom partitions: the survey draws them only as room boundaries, so
  # each sits in the 0.10 gap between the clear polygons it separates.
  - { id: W_bed5_n, name: "Ściana sypialnia 1 / korytarz", at: [0.40, 4.86], size: [2.97, 0.10], note: "bedroom 5 north wall to corridor, holds D5" }
  - { id: W_bed6_n, name: "Ściana sypialnia 2 / korytarz", at: [3.47, 4.86], size: [2.78, 0.10], note: "bedroom 6 north wall to corridor, holds D6" }
  - { id: W_bed5_6, name: "Ściana sypialnia 1 / 2", at: [3.37, 0.40], size: [0.10, 4.46], note: "between bedrooms 5 and 6" }
  - { id: W_bed7_w, name: "Ściana sypialnia 3 / korytarz", at: [6.25, 1.34], size: [0.10, 4.54], note: "bedroom 7 west wall to corridor, holds D7" }

# Structural column in the storage's south wall, flush with the corridor face
# and projecting into the storage (0.60 along the wall x 0.25 deep; measured
# off the survey photo at 0.65 x 0.30 before erosion correction).
columns:
  - { id: C_store, at: [3.99, 5.88], size: [0.60, 0.25] }

# Service risers on the east wall of the open space, cased in 0.10 walls and
# projecting 0.32 into the room. The 2.58 wall runs its full length to the
# east wall behind the drainage riser, so only 2.30 of its face is exposed.
shafts:
  - { id: SH_vent, at: [8.64, 7.33], size: [0.32, 0.79], service: wentylacja / ventilation }
  - { id: SH_san, at: [8.64, 5.98], size: [0.32, 0.39], service: kanalizacja / drainage }

